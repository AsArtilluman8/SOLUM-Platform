name: Filament v1.71.4 SOLUM Cardinal R23 V1

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filament-v1714-solum-cardinal-r23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-filament-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FILAMENT_COMMIT: a0ecdbbeba5f1005bbad0a4c8b2fe6955788cdee
      FILAMENT_DIR: filament-src
      LOG_DIR: filament-ci-logs
      R22_PATCH: third_party/filament-solum/patches/0015-solum-instance-buffer-android-bridge.patch
      R23_PATCH: third_party/filament-solum/patches/0016-solum-cardinal-native-r23.patch

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Checkout exact Filament runtime baseline
        uses: actions/checkout@v4
        with:
          repository: google/filament
          ref: ${{ env.FILAMENT_COMMIT }}
          path: ${{ env.FILAMENT_DIR }}
          submodules: recursive
          fetch-depth: 1

      - name: Apply exact R22 plus Cardinal R23
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C "$FILAMENT_DIR" rev-parse HEAD)" = "$FILAMENT_COMMIT"
          PATCH_DIR="third_party/filament-solum/patches"
          PATCHES=(
            "$PATCH_DIR/0001-solum-async-framegraph-gpu-profiler.patch"
            "$PATCH_DIR/0002-solum-adaptive-taa-history.patch"
            "$PATCH_DIR/0003-solum-taa-previous-depth-history.patch"
            "$PATCH_DIR/0004-solum-taa-prev-depth-stable-accum.patch"
            "$PATCH_DIR/0005-solum-v1-conservative-shading-cache.patch"
            "$PATCH_DIR/0006-solum-tessera-regional-v0.patch"
            "$PATCH_DIR/0007-solum-tessera-regional-color-lifetime.patch"
            "$PATCH_DIR/0008-solum-tessera-regional-persistent-history.patch"
            "$PATCH_DIR/0009-solum-tessera-regional-v02.patch"
            "$PATCH_DIR/0010-solum-tessera-regional-early-skip.patch"
            "$PATCH_DIR/0011-solum-tessera-regional-correctness-r17.patch"
            "$PATCH_DIR/0012-solum-tessera-regional-r19-opaque-skip.patch"
            "$PATCH_DIR/0013-solum-perf-v3-mask-aware-coverage.patch"
            "$PATCH_DIR/0014-solum-perf-v3-mask-aware-r21-correctness.patch"
          )
          for patch in "${PATCHES[@]}" "$R22_PATCH" "$R23_PATCH"; do test -f "$patch"; done
          sha256sum "${PATCHES[@]}" "$R22_PATCH" "$R23_PATCH" \
            | tee filament-solum-patches.sha256
          for index in 0 1 2 3 4 5 6 7; do
            git -C "$FILAMENT_DIR" apply --check "$GITHUB_WORKSPACE/${PATCHES[$index]}"
            git -C "$FILAMENT_DIR" apply "$GITHUB_WORKSPACE/${PATCHES[$index]}"
          done
          for index in 8 9 10; do
            git -C "$FILAMENT_DIR" apply --unidiff-zero --check \
              "$GITHUB_WORKSPACE/${PATCHES[$index]}"
            git -C "$FILAMENT_DIR" apply --unidiff-zero \
              "$GITHUB_WORKSPACE/${PATCHES[$index]}"
          done
          for index in 11 12 13; do
            git -C "$FILAMENT_DIR" apply --check "$GITHUB_WORKSPACE/${PATCHES[$index]}"
            git -C "$FILAMENT_DIR" apply "$GITHUB_WORKSPACE/${PATCHES[$index]}"
          done
          git -C "$FILAMENT_DIR" apply --recount --check "$GITHUB_WORKSPACE/$R22_PATCH"
          git -C "$FILAMENT_DIR" apply --recount "$GITHUB_WORKSPACE/$R22_PATCH"
          git -C "$FILAMENT_DIR" apply --check "$GITHUB_WORKSPACE/$R23_PATCH"
          git -C "$FILAMENT_DIR" apply "$GITHUB_WORKSPACE/$R23_PATCH"
          git -C "$FILAMENT_DIR" add -N \
            android/filament-android/src/main/cpp/InstanceBuffer.cpp \
            android/filament-android/src/main/java/com/google/android/filament/InstanceBuffer.java \
            android/filament-android/src/main/cpp/CardinalManager.cpp \
            android/filament-android/src/main/java/com/google/android/filament/CardinalManager.java \
            filament/include/filament/CardinalManager.h filament/src/CardinalManager.cpp \
            filament/src/details/CardinalManager.h filament/src/details/CardinalManager.cpp
          git -C "$FILAMENT_DIR" diff --check
          git -C "$FILAMENT_DIR" diff --stat | tee filament-cardinal-r23-diff-stat.txt
          ! git -C "$FILAMENT_DIR" diff | grep -E 'flushAndWait|waitForGpu|fenceWait'
          git -C "$FILAMENT_DIR" diff | grep -F 'CARDINAL_NATIVE_STRUCTURE_REUSE'
          git -C "$FILAMENT_DIR" diff | grep -F 'resolveEntity'
          git -C "$FILAMENT_DIR" diff | grep -F 'commandsRemoved'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake git libc++-dev libc++abi-dev \
            libglu1-mesa-dev ninja-build pkg-config unzip zip

      - name: Native Cardinal contract
        shell: bash
        run: |
          set -euxo pipefail
          clang++ -std=c++17 \
            -I"$FILAMENT_DIR/filament/include" -I"$FILAMENT_DIR/filament/src" \
            -I"$FILAMENT_DIR/libs/utils/include" -I"$FILAMENT_DIR/libs/math/include" \
            -I"$FILAMENT_DIR/third_party/robin-map/include" \
            tools/p63_tests/SolumCardinalNativeContractTest.cpp \
            "$FILAMENT_DIR/filament/src/details/CardinalManager.cpp" \
            -o /tmp/solum-cardinal-native-contract
          /tmp/solum-cardinal-native-contract

      - name: Install exact Filament Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$FILAMENT_DIR"
          NDK_VERSION="$(sed -n 's/^GITHUB_NDK_VERSION=//p' build/common/versions)"
          test -n "$NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "FILAMENT_NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build Android arm64-v8a release artifacts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$LOG_DIR"
          cd "$FILAMENT_DIR"
          export CC=clang
          export CXX=clang++
          START_EPOCH="$(date +%s)"
          FILAMENT_NDK_VERSION="$FILAMENT_NDK_VERSION" \
            ./build.sh -p android -q arm64-v8a -i release \
            2>&1 | tee "../$LOG_DIR/build-android-arm64-release.log"
          echo "$(( $(date +%s) - START_EPOCH ))" > ../filament-build-duration-seconds.txt

      - name: Prove Java and JNI Cardinal API
        shell: bash
        run: |
          set -euxo pipefail
          FILAMENT_AAR="$(find "$FILAMENT_DIR" -type f -name 'filament-android*.aar' | head -n 1)"
          test -n "$FILAMENT_AAR"
          unzip -p "$FILAMENT_AAR" classes.jar > /tmp/filament-cardinal-r23-classes.jar
          javap -classpath /tmp/filament-cardinal-r23-classes.jar \
            com.google.android.filament.CardinalManager | tee "$LOG_DIR/cardinal-api.txt"
          grep -F 'publishDecisions' "$LOG_DIR/cardinal-api.txt"
          grep -F 'getReadback' "$LOG_DIR/cardinal-api.txt"
          JNI_SO="$(find "$FILAMENT_DIR" -type f -name 'libfilament-jni.so' | head -n 1)"
          readelf -Ws "$JNI_SO" | tee "$LOG_DIR/filament-jni-symbols.txt"
          grep -F 'CardinalManager_nPublishDecisions' "$LOG_DIR/filament-jni-symbols.txt"
          grep -F 'CardinalManager_nGetReadback' "$LOG_DIR/filament-jni-symbols.txt"

      - name: Collect checksummed artifacts
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          ARTIFACT_DIR="filament-solum-cardinal-r23-artifacts"
          mkdir -p "$ARTIFACT_DIR/logs" "$ARTIFACT_DIR/aars" "$ARTIFACT_DIR/native"
          cp -R "$LOG_DIR"/. "$ARTIFACT_DIR/logs/" || true
          cp filament-solum-patches.sha256 filament-cardinal-r23-diff-stat.txt \
            filament-build-duration-seconds.txt "$ARTIFACT_DIR/" || true
          find "$FILAMENT_DIR" -type f -path '*/build/outputs/aar/*.aar' \
            -print -exec cp -v {} "$ARTIFACT_DIR/aars/" \; || true
          find "$FILAMENT_DIR/out" -type f -name '*.aar' \
            -print -exec cp -v {} "$ARTIFACT_DIR/aars/" \; || true
          find "$FILAMENT_DIR" -type f -path '*/arm64-v8a/*.so' \
            -print -exec cp -v {} "$ARTIFACT_DIR/native/" \; || true
          printf '%s\n' "$FILAMENT_COMMIT" > "$ARTIFACT_DIR/filament-source-commit.txt"
          printf '%s\n' '1.71.4-ci-perf-r23-cardinal-v1' > "$ARTIFACT_DIR/fork-version.txt"
          find "$ARTIFACT_DIR" -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$ARTIFACT_DIR/SHA256SUMS.txt"

      - name: Upload R23 build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filament-v1714-solum-cardinal-r23-arm64
          path: filament-solum-cardinal-r23-artifacts/**
          if-no-files-found: error
