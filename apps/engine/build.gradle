plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solum.engine'
    compileSdk 34

    defaultConfig {
        applicationId 'com.solum.engine'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.4.0'
    }
}


dependencies {
    implementation "com.solum.filament:filament-android:1.71.4-ci"
    implementation "com.solum.filament:gltfio-android:1.71.4-ci"
    implementation "com.solum.filament:filament-utils-android:1.71.4-ci"
}
