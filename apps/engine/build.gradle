plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solum.engine'
    compileSdk 34

    defaultConfig {
        applicationId 'com.solum.engine'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'com.solum.engine.P63CelestialControlsViewTest'
    }

    sourceSets {
        main {
            // Optional private P62B hit WAVs are packaged locally when present, but are never
            // copied into public source. P63 always has SOLUM-native procedural audio fallback.
            assets.srcDir "${rootProject.projectDir}/generated_local/uds_visual_preview/assets"
        }
    }
}


dependencies {
    implementation "com.solum.filament:filament-android:1.71.4-ci"
    implementation "com.solum.filament:gltfio-android:1.71.4-ci"
    implementation "com.solum.filament:filament-utils-android:1.71.4-ci"
}
