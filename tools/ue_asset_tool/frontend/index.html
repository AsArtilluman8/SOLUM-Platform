<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>SOLUM UDS Truth</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">P59 · canonical UE extraction</p>
      <h1>UDS Truth Reader</h1>
    </div>
    <span id="gateBadge" class="status waiting">Loading</span>
  </header>

  <main>
    <section id="summary" class="hero" aria-live="polite">
      <p>Loading canonical dataset…</p>
    </section>

    <div class="toolbar">
      <label class="search"><span>Search assets</span><input id="search" type="search" autocomplete="off" aria-label="Class, package or asset ID"></label>
      <label><span>Section</span><select id="sectionSelect" aria-label="Section"></select></label>
    </div>

    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <button data-section="Overview" class="active"><span>◉</span>Overview</button>
    <button data-section="Asset Browser"><span>▦</span>Assets</button>
    <button data-section="Blueprint Graph"><span>⌘</span>Graphs</button>
    <button data-section="Audio"><span>▶</span>Media</button>
    <button data-section="Errors"><span>!</span>Errors</button>
  </nav>

  <template id="emptyTemplate"><div class="empty"><h2>No verified records</h2><p>The dataset reports no exact output for this section.</p></div></template>
  <script src="app.js" defer></script>
</body>
</html>
