[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-asset-tool"
version = "0.4.0"
description = "Strict, provenance-first Unreal Engine package inspector and extractor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "UE Asset Tool contributors"}]
dependencies = []

[project.scripts]
uex = "ueassettool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
